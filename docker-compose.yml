services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: lihengkh/homework:v1
    container_name: counter-web
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_VERSION=v1.0
      - APP_TITLE=Cloud Counter - Docker & Swarm Demo (v1.0)
    depends_on:
      - redis
    networks:
      - counter-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: counter-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - counter-net
    restart: unless-stopped

networks:
  counter-net:
    driver: bridge

volumes:
  redis_data:
    driver: local

